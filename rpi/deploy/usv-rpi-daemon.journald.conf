# Rotacao/limite de log do daemon USV-AM (F3)
#
# O daemon loga no journald (StandardOutput=journal na unit). Em campo, num RPi
# com cartao SD, um journal sem limite enche o cartao e degrada a escrita. Estas
# opcoes limitam o tamanho total do journal persistente.
#
# Instalacao (no RPi):
#   sudo cp usv-rpi-daemon.journald.conf /etc/systemd/journald.conf.d/usv.conf
#   sudo systemctl restart systemd-journald
#
# Alternativa (log em arquivo + logrotate) esta documentada no README.

[Journal]
# Persistente entre reboots, mas com teto de tamanho
Storage=persistent
# Teto do journal persistente (todos os servicos somados)
SystemMaxUse=100M
# Tamanho de cada arquivo antes de rotacionar
SystemMaxFileSize=10M
# Descarta entradas com mais de 2 semanas
MaxRetentionSec=2week
