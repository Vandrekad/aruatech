; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Filesystem e partição FIXOS: garantem uma região LittleFS de tamanho
; determinístico entre flashes. Sem isto, uma troca de layout de partição deixa
; o superbloco do LittleFS inconsistente (block_count inválido) e o lfs_alloc
; trava em IntegerDivideByZero → boot loop. default.csv reserva ~1.5MB de app +
; ~1.5MB de FS, suficiente para o buffer de telemetria offline.
board_build.filesystem = littlefs
board_build.partitions = default.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
